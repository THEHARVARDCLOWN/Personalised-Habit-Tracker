<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly habit tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f0ec;
  --surface: rgba(255, 255, 254, 0.8);
  --surface-strong: rgba(255, 255, 254, 0.96);
  --ink: #13161d;
  --muted: #5a5f6b;
  --line: rgba(19, 22, 29, 0.13);
  --accent: #1d3557;
  --accent-ink: #f6f1e4;
  --accent-soft: rgba(29, 53, 87, 0.1);
  --danger: #b3261e;
  --radius-lg: 22px;
  --radius-sm: 11px;
  --font: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1017;
    --surface: rgba(19, 25, 35, 0.8);
    --surface-strong: rgba(17, 22, 31, 0.96);
    --ink: #eceef2;
    --muted: #98a0ae;
    --line: rgba(236, 238, 242, 0.12);
    --accent: #c8a96b;
    --accent-ink: #19140a;
    --accent-soft: rgba(200, 169, 107, 0.15);
    --danger: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1017;
  --surface: rgba(19, 25, 35, 0.8);
  --surface-strong: rgba(17, 22, 31, 0.96);
  --ink: #eceef2;
  --muted: #98a0ae;
  --line: rgba(236, 238, 242, 0.12);
  --accent: #c8a96b;
  --accent-ink: #19140a;
  --accent-soft: rgba(200, 169, 107, 0.15);
  --danger: #ff8a80;
  color-scheme: dark;
}
:root[data-theme="dusk"] {
  --bg: #1b1730;
  --surface: rgba(35, 29, 60, 0.76);
  --surface-strong: rgba(31, 26, 54, 0.95);
  --ink: #f2eeff;
  --muted: #b4abd8;
  --line: rgba(242, 238, 255, 0.15);
  --accent: #f3b646;
  --accent-ink: #231a05;
  --accent-soft: rgba(243, 182, 70, 0.16);
  --danger: #ff9b8f;
  color-scheme: dark;
}
:root[data-theme="custom"] { --danger: #e5484d; }

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s ease, color .25s ease;
}
button, input, select { font: inherit; color: inherit; }
img { max-width: 100%; }

/* background layers */
.backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.bg-img { position: absolute; inset: 0; background-size: cover; background-position: center; }
.bg-dim { position: absolute; inset: 0; background: var(--bg); transition: opacity .2s ease; }

.shell {
  position: relative; z-index: 1;
  max-width: 1040px; margin: 0 auto;
  padding: clamp(20px, 4vw, 48px) clamp(14px, 3vw, 32px) 64px;
}

/* header: the week title carries the page */
.top {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.title-block {
  background: var(--surface);
  -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 14px 22px 16px;
}
h1 {
  margin: 0;
  font-size: clamp(2.4rem, 7vw, 4.2rem);
  font-variation-settings: "opsz" 96;
  font-weight: 700;
  letter-spacing: -0.035em;
  line-height: 0.95;
}
.range { margin: 8px 0 0; color: var(--muted); font-size: 1rem; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.week-nav { display: flex; gap: 4px; }

/* buttons & fields */
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-radius: 999px;
  padding: 9px 16px;
  font-weight: 560;
  cursor: pointer;
  min-height: 42px;
  transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn.icon { width: 42px; padding: 0; display: grid; place-items: center; }
.week-nav .btn { min-width: 42px; font-size: 1.15rem; }
.week-nav .btn:not([aria-label]) { font-size: .95rem; }
.btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn.text-danger { background: transparent; border-color: transparent; color: var(--danger); -webkit-backdrop-filter: none; backdrop-filter: none; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.grow { flex: 1 1 220px; }
.field > span { font-size: .85rem; color: var(--muted); font-weight: 520; }
.field input:not([type="range"]), .field select {
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  min-height: 42px;
  width: 100%;
}
.field select { padding-right: 8px; min-width: 96px; }
.field input:focus, .field select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="range"] { accent-color: var(--accent); width: 100%; }

/* main panel */
.panel {
  background: var(--surface);
  -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: clamp(14px, 2.5vw, 24px);
  box-shadow: 0 20px 50px -30px rgba(0, 0, 0, .45);
}
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.summary { margin: 0; font-size: 1.15rem; }
.summary strong { font-size: 1.5rem; color: var(--accent); font-weight: 700; }
.sync { margin: 0; font-size: .85rem; color: var(--muted); }
.sync.error { color: var(--danger); }

.empty { padding: 28px 4px 24px; max-width: 46ch; }
.empty h2 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: -0.02em; }
.empty p { margin: 0; color: var(--muted); }

/* the grid */
.grid-scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px 4px; }
.grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 640px; }
.grid thead th { font-weight: 560; padding: 0 0 10px; }
.habit-col { text-align: left; color: var(--muted); font-size: .85rem; }
.progress-col { text-align: right; color: var(--muted); font-size: .85rem; padding-left: 12px !important; }
.day-head { text-align: center; width: 64px; }
.day-head .dname { display: block; font-size: .8rem; color: var(--muted); }
.day-head .dnum { display: inline-grid; place-items: center; min-width: 32px; height: 32px; margin-top: 2px; border-radius: 999px; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.day-head.today .dname { color: var(--accent); font-weight: 650; }
.day-head.today .dnum { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.row > * { border-top: 1px solid var(--line); }
.habit-cell {
  text-align: left; font-weight: 400;
  position: sticky; left: 0; z-index: 1;
  background: var(--surface-strong);
  padding: 0; min-width: 170px; max-width: 280px;
}
.habit-name {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  width: 100%; text-align: left;
  background: none; border: 0; cursor: pointer;
  padding: 12px 12px 12px 6px; border-radius: var(--radius-sm);
}
.habit-name:hover .name-text { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.name-text { font-weight: 620; font-size: 1.05rem; overflow-wrap: anywhere; }
.target-text { font-size: .8rem; color: var(--muted); }

.day { text-align: center; padding: 8px 4px; }
.day.today { background: var(--accent-soft); }
.check {
  width: 46px; height: 46px;
  border-radius: 13px;
  border: 1.5px solid var(--line);
  background: var(--surface-strong);
  display: inline-grid; place-items: center;
  cursor: pointer;
  color: var(--accent-ink);
  transition: background-color .15s ease, border-color .15s ease, transform .12s ease;
}
.check:hover:not(:disabled) { border-color: var(--accent); }
.check.on { background: var(--accent); border-color: var(--accent); animation: pop .22s ease-out; }
.check:disabled { opacity: .3; cursor: default; border-style: dashed; }
@keyframes pop { 0% { transform: scale(.82); } 70% { transform: scale(1.06); } 100% { transform: scale(1); } }

.progress-cell { padding: 8px 0 8px 12px; }
.progress { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 64px; }
.progress .count { font-weight: 650; font-variant-numeric: tabular-nums; }
.progress .bar { display: block; width: 64px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--muted); border-radius: inherit; transition: width .25s ease; }
.progress.met .count { color: var(--accent); }
.progress.met .bar i { background: var(--accent); }

.row.editing td { padding: 12px 0; }
.edit-box { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.edit-msg { margin: 0; flex: 1 1 100%; font-weight: 560; }
.edit-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.add-habit {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
  margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line);
}

/* settings drawer */
.drawer-wrap { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
.drawer-wrap.open { pointer-events: auto; }
.drawer-scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .35); opacity: 0; transition: opacity .2s ease; }
.drawer-wrap.open .drawer-scrim { opacity: 1; }
.drawer {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: min(400px, 100%);
  background: var(--surface-strong);
  -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
  border-left: 1px solid var(--line);
  padding: 20px 22px 32px;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform .25s ease;
}
.drawer-wrap.open .drawer { transform: none; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.drawer-head h2 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
.setting { padding: 18px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.setting h3 { margin: 0; font-size: 1.05rem; }
.segmented { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.seg {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; min-height: 46px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--line);
  background: var(--surface);
  cursor: pointer; font-weight: 560; text-align: left;
}
.seg.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.swatch { width: 20px; height: 20px; border-radius: 6px; border: 1px solid rgba(128,128,128,.4); flex: none; }
.sw-light { background: linear-gradient(135deg, #f1f0ec 50%, #1d3557 50%); }
.sw-dark { background: linear-gradient(135deg, #0c1017 50%, #c8a96b 50%); }
.sw-dusk { background: linear-gradient(135deg, #1b1730 50%, #f3b646 50%); }
.color-row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.color-row input[type="color"] { width: 48px; height: 40px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 2px; background: var(--surface); cursor: pointer; }
code { font-size: .85em; color: var(--muted); }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { margin: 0; font-size: .85rem; color: var(--muted); }
.status { margin: 0; font-size: .9rem; padding: 8px 12px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--line); }
.status.error { color: var(--danger); border-color: var(--danger); }
.status.ok { color: var(--accent); }
.setting .btn.text-danger { align-self: flex-start; padding-left: 0; }


/* tabs */
.tabs {
  display: flex; padding: 4px; gap: 2px;
  background: var(--surface);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border: 1px solid var(--line); border-radius: 999px;
}
.tab { border: 0; background: transparent; border-radius: 999px; padding: 7px 16px; min-height: 34px; font-weight: 580; cursor: pointer; color: var(--muted); }
.tab.on { background: var(--accent); color: var(--accent-ink); }
.tab:not(.on):hover { color: var(--ink); }

/* analysis */
.analysis { display: flex; flex-direction: column; gap: 16px; }
.analysis h2 { margin: 0; font-size: 1.25rem; letter-spacing: -0.015em; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card .hint { margin-top: -6px; }
.segmented.inline { display: inline-flex; gap: 6px; }
.segmented.inline .seg { min-height: 40px; padding: 8px 16px; }
.overview-head { margin-bottom: 12px; }
.overview-body { display: flex; align-items: center; gap: clamp(16px, 4vw, 40px); flex-wrap: wrap; }
.ring { width: clamp(130px, 28vw, 170px); height: auto; flex: none; }
.ring-track { fill: none; stroke: var(--line); stroke-width: 12; }
.ring-fill { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring-text { fill: var(--ink); font-size: 26px; font-weight: 700; font-family: var(--font); }
.overview-stats p { margin: 0 0 4px; color: var(--muted); }
.overview-stats strong { color: var(--ink); }
.big-stat { font-size: clamp(2.2rem, 6vw, 3.2rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--ink) !important; margin-bottom: 10px !important; }
.big-stat span { font-size: 1rem; font-weight: 500; letter-spacing: 0; color: var(--muted); }

.hbars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.hbar-top { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 5px; }
.hbar-name { font-weight: 600; overflow-wrap: anywhere; }
.hbar-val { font-weight: 700; font-variant-numeric: tabular-nums; }
.hbar-track { display: block; height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
.hbar-track i { display: block; height: 100%; border-radius: inherit; background: var(--muted); transition: width .4s ease; }
.hbar-track i.met { background: var(--accent); }
.hbar-sub { display: block; margin-top: 4px; font-size: .8rem; color: var(--muted); }

.chart-scroll { overflow-x: auto; }
.line-chart { width: 100%; min-width: 420px; height: auto; display: block; }
.grid-line { stroke: var(--line); stroke-width: 1; }
.axis-text { fill: var(--muted); font-size: 12px; font-family: var(--font); }
.trend-line { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.trend-dot { fill: var(--surface-strong); stroke: var(--accent); stroke-width: 2.5; }

.two-up { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.vbars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; }
.vbar { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.vbar-val { font-size: .8rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.vbar-track { width: 100%; max-width: 34px; height: 150px; background: var(--line); border-radius: 9px; display: flex; align-items: flex-end; overflow: hidden; }
.vbar-track i { display: block; width: 100%; background: var(--accent); border-radius: 9px 9px 0 0; transition: height .4s ease; }
.vbar-name { font-size: .8rem; color: var(--muted); }

.heatmap { display: flex; gap: 4px; padding-bottom: 4px; width: max-content; }
.hm-col { display: flex; flex-direction: column; gap: 4px; }
.hm-month { height: 16px; font-size: .72rem; color: var(--muted); white-space: nowrap; width: var(--cell); overflow: visible; }
.hm-daylabel { height: var(--cell); font-size: .72rem; color: var(--muted); display: flex; align-items: center; padding-right: 4px; }
.hm-cell { width: var(--cell); height: var(--cell); border-radius: max(3px, calc(var(--cell) / 5)); display: block; }
.hm-cell.out { background: transparent; border: 1px dashed var(--line); }
.hm-cell.zero { background: var(--line); }
.hm-cell.fill { background: var(--accent); opacity: var(--a, 1); }
.hm-legend { display: flex; align-items: center; gap: 4px; margin-top: 10px; font-size: .75rem; color: var(--muted); --cell: 12px; }
.hm-legend span:first-child { margin-right: 4px; }
.hm-legend span:last-child { margin-left: 4px; }

@media (max-width: 560px) {
  .tabs { flex: 1; }
  .tab { flex: 1; }
  .segmented.inline { display: flex; width: 100%; }
  .segmented.inline .seg { flex: 1; justify-content: center; padding: 8px; }
}

/* profile */
.hello { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-weight: 600; font-size: 1.05rem; }
.avatar {
  display: inline-grid; place-items: center; flex: none; overflow: hidden;
  border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 700; line-height: 1;
  box-shadow: 0 0 0 2px var(--surface-strong), 0 0 0 3.5px var(--accent);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-picker { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.photo-picker .row-actions { align-items: center; }
.photo-picker .text-danger { padding-left: 4px; }
.name-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.onboard-wrap {
  position: fixed; inset: 0; z-index: 20;
  display: grid; place-items: center; padding: 16px;
  background: rgba(0, 0, 0, .4);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  overflow-y: auto;
}
.onboard {
  width: min(440px, 100%);
  background: var(--surface-strong);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: clamp(22px, 5vw, 34px);
  display: flex; flex-direction: column; gap: 18px;
  box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .6);
  animation: rise .3s ease-out;
}
.onboard h1 { font-size: clamp(2.4rem, 9vw, 3.4rem); }
.onboard-lead { margin: -8px 0 0; color: var(--muted); }
.onboard .hint { text-align: center; }
.btn.wide { width: 100%; min-height: 48px; font-size: 1.05rem; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

@media (max-width: 560px) {
  .top { align-items: stretch; }
  .title-block { width: 100%; }
  .top-actions { width: 100%; justify-content: space-between; }
  .check { width: 40px; height: 40px; border-radius: 11px; }
  .day-head { width: 50px; }
  .habit-cell { min-width: 130px; }
  .add-habit .btn { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
/*__APP__*/
</script>
</body>
</html>
